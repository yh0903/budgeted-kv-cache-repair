[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "budgeted-kv-cache-repair"
version = "0.1.0"
description = "Semantic-unit allocation and packed execution for budgeted KV-cache repair"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "torch==2.9.1",
  "transformers==4.57.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1", "build>=1.2,<2"]
triton = ["triton==3.5.1; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[project.urls]
Paper = "https://arxiv.org/abs/2610.17338"
Repository = "https://github.com/yh0903/budgeted-kv-cache-repair"

[tool.hatch.build.targets.wheel]
packages = ["src/kv_cache_repair"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/examples", "/benchmarks", "/README.md",
  "/CITATION.cff", "/citation.bib", "/pyproject.toml", "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["cuda: requires a CUDA GPU and optional GPU dependencies"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
